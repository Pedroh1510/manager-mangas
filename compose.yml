services:
  mangas:
    build: .
    image: mangas
    container_name: mangas
    command: npm run dev
    volumes:
      - ./src:/app/src
    env_file:
      - .env.development
    environment:
      - runDocker=true
      - POSTGRES_HOST=database
      - POSTGRES_PORT=5432
      - REDIS_HOST=cache
      - KAVITA_URL=http://kavita-dev-mangas:5000
    ports:
      - 9229:9229
      - 3001:3001
    networks:
      - mangas

networks:
  mangas:
    external: true
