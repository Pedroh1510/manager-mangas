name: Security audit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      # Production deps only: `braces` (all versions, no patched release) reaches
      # the tree solely through dev tooling (nodemon/tailwindcss -> chokidar)
      # and parses only the tool's own glob patterns.
      - name: Audit production deps (fails on high/critical)
        run: npm audit --omit=dev --audit-level=high
